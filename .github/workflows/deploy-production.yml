name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  workflow_dispatch:

# Garante que apenas um deploy SSH rode por vez no mesmo droplet.
# Se staging estiver deployando, produção aguarda na fila (cancel-in-progress: false).
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME_BACKEND: ${{ secrets.DOCKER_USERNAME }}/assapp-backend
  IMAGE_NAME_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/assapp-frontend

jobs:
  verify-staging:
    name: Aguardar staging OK (mesmo commit)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout (histórico para comparar branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirmar commit em develop
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor "${{ github.sha }}" "origin/develop"; then
            echo "❌ Este commit não está em origin/develop."
            echo "Fluxo obrigatório: push develop → validar staging → push main"
            echo "Ver docs/guias/GIT_WORKFLOW.md"
            exit 1
          fi
          echo "✅ Commit presente em origin/develop"

      - name: Aguardar Deploy to Staging concluir com sucesso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="${{ github.sha }}"
          REPO="${{ github.repository }}"
          # Mesmos paths-ignore do deploy-staging.yml: commits só de docs não geram run de staging
          TARGET=$(git log -1 --format=%H "$COMMIT" -- . \
            ':(exclude,glob)**/*.md' ':(exclude)docs' ':(exclude,glob).github/*.md')
          if [ -z "$TARGET" ]; then
            echo "✅ Nenhuma mudança de código no histórico — nada a validar"
            exit 0
          fi
          CANDIDATES=$(git rev-list "$COMMIT" --not $(git rev-list --parents -n 1 "$TARGET" | cut -d' ' -f2-))
          echo "Último commit com código: ${TARGET}"
          echo "Aceita staging de qualquer um destes (código + commits só de docs depois dele):"
          echo "$CANDIDATES"
          SHAS_JSON=$(echo "$CANDIDATES" | jq -R . | jq -sc .)

          for attempt in $(seq 1 90); do
            RUNS=$(gh run list \
              --repo "$REPO" \
              --workflow=deploy-staging.yml \
              --branch develop \
              --json headSha,status,conclusion \
              --limit 50 \
              | jq -c --argjson shas "$SHAS_JSON" '[.[] | select(.headSha as $s | $shas | index($s))]')
            echo "Tentativa ${attempt}/90: ${RUNS}"
            if echo "$RUNS" | jq -e 'any(.[]; .conclusion == "success")' >/dev/null; then
              echo "✅ Staging validado — produção pode continuar"
              exit 0
            fi
            if echo "$RUNS" | jq -e 'length > 0 and all(.[]; .status == "completed")' >/dev/null; then
              echo "❌ Deploy staging falhou ou foi cancelado para este código — produção bloqueada"
              exit 1
            fi
            sleep 30
          done
          echo "❌ Timeout (45 min) aguardando staging para ${TARGET}"
          exit 1

  build-and-deploy:
    needs: verify-staging
    if: always() && (needs.verify-staging.result == 'success' || needs.verify-staging.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_USERNAME / DOCKER_PASSWORD não configurados"
            echo "Veja: .github/CHECKLIST_SECRETS.md"
            exit 1
          fi
          echo "✅ Secrets de registry OK"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          build-args: |
            VITE_GA_ID=G-S7EMQXSSJX
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check deploy secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DO_HOST }}" ] && [ -n "${{ secrets.DO_USER }}" ] && [ -n "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "deploy_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to DigitalOcean (Production)
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1.0.0
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: SMTP_PASSWORD
          script: |
            set -e
            APP_DIR="/opt/assapp"
            USER_NAME="${{ secrets.DO_USER }}"
            if [ "$USER_NAME" = "root" ]; then SUDO_CMD=""; else SUDO_CMD="sudo"; fi

            if [ -n "${{ secrets.G_TOKEN_DEPLOY }}" ]; then
              REPO_URL="https://${{ secrets.G_TOKEN_DEPLOY }}@github.com/${{ github.repository }}.git"
            else
              REPO_URL="https://github.com/${{ github.repository }}.git"
            fi

            $SUDO_CMD mkdir -p "$APP_DIR"
            if [ "$USER_NAME" != "root" ]; then
              $SUDO_CMD chown "$USER_NAME:$USER_NAME" "$APP_DIR" || true
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              cd /tmp && rm -rf assapp-temp
              git clone "$REPO_URL" assapp-temp
              $SUDO_CMD cp -a assapp-temp/. "$APP_DIR/"
              rm -rf assapp-temp
            fi

            git config --global --add safe.directory "$APP_DIR" || true
            cd "$APP_DIR"
            if [ -n "${{ secrets.G_TOKEN_DEPLOY }}" ]; then
              git remote set-url origin "https://${{ secrets.G_TOKEN_DEPLOY }}@github.com/${{ github.repository }}.git" || true
            fi
            git fetch origin
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git reset --hard origin/main
            git pull origin main

            if [ ! -f .env.production ]; then
              cp env.production.example .env.production
            fi

            sed -i "s|^DOCKER_USERNAME=.*|DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}|" .env.production
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=latest|" .env.production
            sed -i "s|^ALLOWED_HOSTS=.*|ALLOWED_HOSTS=159.203.183.184,gesttora.com.br,www.gesttora.com.br,gesttora.vertent.com.br,localhost,127.0.0.1|" .env.production
            if grep -q '^FRONTEND_URL=' .env.production; then
              sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=https://gesttora.com.br|" .env.production
            else
              echo "FRONTEND_URL=https://gesttora.com.br" >> .env.production
            fi
            sed -i "s|^DEFAULT_FROM_EMAIL=noreply@vertent.com.br$|DEFAULT_FROM_EMAIL=noreply@gesttora.com.br|" .env.production

            set_env() {
              grep -v "^$1=" .env.production > .env.production.tmp || true
              printf "%s='%s'\n" "$1" "$2" >> .env.production.tmp
              mv .env.production.tmp .env.production
            }
            if [ -n "$SMTP_PASSWORD" ]; then
              case "$SMTP_PASSWORD" in
                *"'"*) echo "❌ SMTP_PASSWORD não pode conter aspas simples"; exit 1 ;;
              esac
              if [ ! -f /opt/assapp-smtp/id_ed25519 ]; then
                echo "❌ SMTP_PASSWORD definido mas falta a chave do túnel em /opt/assapp-smtp"; exit 1
              fi
              set_env EMAIL_BACKEND core.email_backend.CotaSMTPBackend
              set_env EMAIL_HOST smtp.dreamhost.com
              set_env EMAIL_PORT 587
              set_env EMAIL_USE_TLS True
              set_env EMAIL_LIMITE_POR_HORA 70
              set_env EMAIL_HOST_USER noreply@gesttora.com.br
              set_env EMAIL_HOST_PASSWORD "$SMTP_PASSWORD"
              set_env DEFAULT_FROM_EMAIL noreply@gesttora.com.br
              grep -Eq "^SUPPORT_EMAIL='?[^' ]" .env.production || set_env SUPPORT_EMAIL contato@gesttora.com.br
            fi
            chmod 600 .env.production
            if grep -q 'CHANGE_THIS_TO_A_STRONG_SECRET_KEY' .env.production; then
              PROD_SECRET=$(openssl rand -hex 32)
              sed -i "s|CHANGE_THIS_TO_A_STRONG_SECRET_KEY|$PROD_SECRET|g" .env.production
            fi
            if grep -q 'CHANGE_THIS_TO_A_STRONG_PASSWORD' .env.production; then
              PROD_DB_PASS=$(openssl rand -hex 24)
              sed -i "s|CHANGE_THIS_TO_A_STRONG_PASSWORD|$PROD_DB_PASS|g" .env.production
            fi

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            export COMPOSE_DOCKER_CLI_BUILD=0
            export DOCKER_BUILDKIT=0
            export IMAGE_TAG=latest
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export DOCKER_PASSWORD="${{ secrets.DOCKER_PASSWORD }}"

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh production

            echo "🌐 Produção: http://${{ secrets.DO_HOST }}/"
            echo "❤️  Health: http://${{ secrets.DO_HOST }}/health/"

      - name: Skip deploy (secrets not configured)
        if: steps.check-secrets.outputs.deploy_enabled == 'false'
        run: |
          echo "⚠️  Deploy SSH pulado — imagens buildadas e enviadas ao Hub."
          echo "Configure DO_HOST, DO_USER, DO_SSH_KEY quando o droplet estiver pronto."
