# Configuração Nginx — AssApp PRODUÇÃO (container; publicado em 127.0.0.1:8081)
# O TLS termina no nginx do host (nginx/host/gesttora.conf), que repassa X-Forwarded-Proto.

map $http_x_forwarded_proto $proto_origem {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    location /health/ {
        access_log off;
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origem;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origem;
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origem;
        proxy_buffering off;
        proxy_pass http://frontend:80;
    }
}
