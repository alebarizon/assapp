# Nginx do HOST (droplet) — /etc/nginx/sites-available/gesttora
# Termina o TLS de gesttora.com.br e repassa para a stack de produção em 127.0.0.1:8081.
# Linhas "managed by Certbot" foram geradas por
# `certbot --nginx -d gesttora.com.br -d www.gesttora.com.br --redirect`; a renovação
# (certbot.timer) reaproveita este arquivo. Ver docs/guias/DEPLOY_DIGITALOCEAN.md.

server {
    server_name gesttora.com.br www.gesttora.com.br _;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gesttora.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gesttora.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Domínio antigo
server {
    listen 80;
    listen [::]:80;
    server_name gesttora.vertent.com.br;
    return 301 https://gesttora.com.br$request_uri;
}

# HTTP: tudo vai para https://gesttora.com.br; /health/ responde em http para diagnóstico pelo IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gesttora.com.br www.gesttora.com.br _;

    location = /health/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://gesttora.com.br$request_uri;
    }
}
