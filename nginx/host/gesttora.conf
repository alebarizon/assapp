# Nginx do HOST (droplet) — /etc/nginx/sites-available/gesttora
# Termina o TLS de gesttora.com.br e repassa para a stack de produção em 127.0.0.1:8081.
# Versão antes do Certbot: `certbot --nginx -d gesttora.com.br -d www.gesttora.com.br --redirect`
# acrescenta o bloco 443 e o redirecionamento http → https. Ver docs/guias/DEPLOY_DIGITALOCEAN.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gesttora.com.br www.gesttora.com.br _;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

# Domínio antigo
server {
    listen 80;
    listen [::]:80;
    server_name gesttora.vertent.com.br;
    return 301 https://gesttora.com.br$request_uri;
}
